name: check

# Fast validation for ordinary commits. Installers are built and published only
# by release.yml, on a tag.
#
# This used to build both platforms' installers on every push, which cost about
# 24 billed minutes a time (Windows bills at 2x) to produce artifacts nobody
# installed. Compiling and testing on Linux catches the same class of mistake
# for a fraction of that; anything Windows-specific surfaces on the tag build,
# which publishes a draft and so cannot ship broken without review.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Read pinned PoB commits
        id: pin
        shell: bash
        run: |
          pin() { awk -v s="[$1]" '$0 == s {f=1; next} /^\[/ {f=0} f && /^commit/' pob-sync.toml | cut -d'"' -f2; }
          echo "commit=$(pin poe2)" >> "$GITHUB_OUTPUT"
          echo "commit1=$(pin poe1)" >> "$GITHUB_OUTPUT"

      # Shared with release.yml. The vendored trees are a pure function of the
      # pinned upstream commits and pob-sync, so a hit skips the clones and the
      # DDS -> WebP decode.
      - name: Cache vendored Path of Building
        id: pob
        uses: actions/cache@v6
        with:
          path: |
            src-tauri/resources/pob
            src-tauri/resources/pob1
          key: pob-${{ runner.os }}-${{ steps.pin.outputs.commit }}-${{ steps.pin.outputs.commit1 }}-${{ hashFiles('crates/pob-sync/**/*.rs', 'crates/pob-sync/Cargo.toml', 'pob-sync.toml') }}

      - name: Checkout PathOfBuilding-PoE2
        if: steps.pob.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: PathOfBuildingCommunity/PathOfBuilding-PoE2
          ref: ${{ steps.pin.outputs.commit }}
          path: upstream/PathOfBuilding-PoE2

      - name: Checkout PathOfBuilding (PoE1)
        if: steps.pob.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: PathOfBuildingCommunity/PathOfBuilding
          ref: ${{ steps.pin.outputs.commit1 }}
          path: upstream/PathOfBuilding

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # setup-bun caches the bun binary, not downloaded packages.
      - name: Cache bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: pob-redux
          cache-on-failure: true
          # Pull requests restore the cache but must not overwrite main's.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - run: bun install --frozen-lockfile

      # Needs no PoB data, so it runs first and fails in seconds.
      # `check` passes --fail-on-warnings.
      - name: Type-check the frontend
        run: bun run check

      # tauri::generate_context! reads frontendDist at compile time, so the
      # bundle has to exist before anything touches the Rust side. `tauri build`
      # used to do this through beforeBuildCommand; nothing here does.
      - name: Build the frontend
        run: bun run build

      - name: Vendor Path of Building
        if: steps.pob.outputs.cache-hit != 'true'
        run: |
          cargo run -p pob-sync -- --source upstream/PathOfBuilding-PoE2 --tree-assets
          cargo run -p pob-sync -- --game poe1 --source upstream/PathOfBuilding --tree-assets

      # Warnings are denied via [workspace.lints.rust], so this fails on them.
      - name: Compile the workspace
        run: cargo check --workspace --all-targets

      - name: Test
        run: cargo test -p pob-redux --lib && cargo test -p pob-engine
